<!DOCTYPE html>
<html>
<head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
</head>

<body>
<a-scene>

    <!-- กล้อง -->
    <a-camera position="0 2 8"></a-camera>

    <!-- ท้องฟ้า -->
    <a-sky color="#87CEEB"></a-sky>

    <!-- พื้น -->
    <a-plane
        position="0 0 0"
        rotation="-90 0 0"
        width="20"
        height="20"
        color="#7CFC00">
    </a-plane>

    <!-- ลำต้น -->
    <a-cylinder
        position="0 1 0"
        radius="0.2"
        height="2"
        color="#8B5A2B">
    </a-cylinder>

    <!-- พุ่มใบ 1 -->
    <a-octahedron
        position="0 2.8 0"
        radius="0.9"
        color="#2E8B57">
    </a-octahedron>

    <!-- พุ่มใบ 2 -->
    <a-octahedron
        position="-0.8 2.4 0"
        radius="0.6"
        color="#32CD32">
    </a-octahedron>

    <!-- พุ่มใบ 3 -->
    <a-octahedron
        position="0.8 2.4 0"
        radius="0.6"
        color="#7CFC00">
    </a-octahedron>

    <!-- พุ่มใบ 4 -->
    <a-octahedron
        position="0 2.1 0.7"
        radius="0.5"
        color="#FFD700">
    </a-octahedron>

    <!-- พุ่มใบ 5 -->
    <a-octahedron
        position="0 2.1 -0.7"
        radius="0.5"
        color="#FF8C00">
    </a-octahedron>

</a-scene>
</body>
</html>
