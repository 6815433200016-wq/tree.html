<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- ต้นไม้ Low Poly -->

<!-- ลำต้น -->
<a-cylinder
    position="0 1 0"
    radius="0.15"
    height="2"
    color="#8B5A2B">
</a-cylinder>

<!-- พุ่มใบสีเขียวเข้ม -->
<a-dodecahedron
    position="-0.6 2.4 0"
    radius="0.6"
    color="#2E8B57">
</a-dodecahedron>

<!-- พุ่มใบสีเขียวอ่อน -->
<a-dodecahedron
    position="0.6 2.8 0.2"
    radius="0.7"
    color="#7CFC00">
</a-dodecahedron>

<!-- พุ่มใบสีเหลือง -->
<a-dodecahedron
    position="0 2.2 -0.5"
    radius="0.45"
    color="#FFD700">
</a-dodecahedron>

<!-- พุ่มใบสีส้ม -->
<a-dodecahedron
    position="-0.8 1.9 0.3"
    radius="0.4"
    color="#FF8C00">
</a-dodecahedron>

<!-- พุ่มใบสีเขียวสด -->
<a-dodecahedron
    position="0.9 2.1 -0.2"
    radius="0.45"
    color="#32CD32">
</a-dodecahedron>
