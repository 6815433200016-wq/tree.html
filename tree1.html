<!DOCTYPE html>
<html>
<head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
</head>

<body>
<a-scene>

    <!-- กล้อง -->
    <a-camera position="0 2 8"></a-camera>

    <!-- ท้องฟ้า -->
    <a-sky color="#87CEEB"></a-sky>

    <!-- พื้น -->
    <a-plane
        position="0 0 0"
        rotation="-90 0 0"
        width="20"
        height="20"
        color="#7CFC00">
    </a-plane>

    <!-- ลำต้น -->
    <a-cylinder
        position="0 1.2 0"
        radius="0.25"
        height="2.4"
        color="#8B5A2B">
    </a-cylinder>

    <!-- กิ่ง -->
    <a-cylinder
        position="-0.4 2.2 0"
        radius="0.08"
        height="1"
        rotation="0 0 40"
        color="#8B5A2B">
    </a-cylinder>

    <a-cylinder
        position="0.4 2.2 0"
        radius="0.08"
        height="1"
        rotation="0 0 -40"
        color="#8B5A2B">
    </a-cylinder>

    <!-- ใบไม้ทรงกลม -->
    <a-sphere
        position="0 3.2 0"
        radius="0.9"
        color="#228B22">
    </a-sphere>

    <a-sphere
        position="-0.8 2.8 0"
        radius="0.6"
        color="#32CD32">
    </a-sphere>

    <a-sphere
        position="0.8 2.8 0"
        radius="0.6"
        color="#ADFF2F">
    </a-sphere>

    <a-sphere
        position="-0.4 2.1 0.4"
        radius="0.45"
        color="#FFD700">
    </a-sphere>

    <a-sphere
        position="0.5 2.0 0.3"
        radius="0.4"
        color="#FF8C00">
    </a-sphere>

</a-scene>
</body>
</html>
